name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Unit + integration tests. Integration tests start real Postgres, Kafka and Redis
  # containers with Testcontainers.
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [payments-service, ledger-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/

  # Whole system in Docker: scripted end-to-end checks, then a load test, then proof that
  # every payment settled and the books still balance.
  e2e-and-load:
    needs: test
    runs-on: ubuntu-latest
    env:
      RATE_LIMIT_CAPACITY: "1000000"            # don't throttle the load generator
      RATE_LIMIT_REFILL_PER_SECOND: "1000000"
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: End-to-end checks
        run: bash scripts/e2e.sh
      - name: Load test (k6)
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --network host -v "$PWD/loadtest:/scripts" -v "$PWD/out:/out" grafana/k6 run \
            -e RATE=200 -e DURATION=60s \
            --summary-trend-stats="avg,med,p(95),p(99),max" \
            --summary-export=/out/summary.json /scripts/payments.js \
            || echo "::warning::k6 latency thresholds not met on this runner"
      - name: Wait for every payment to settle
        run: |
          for i in $(seq 1 120); do
            stats=$(curl -fsS http://localhost:8081/api/v1/payments/stats)
            pending=$(echo "$stats" | jq .PENDING)
            echo "$stats"
            [ "$pending" = "0" ] && break
            sleep 2
          done
          [ "$pending" = "0" ] || { echo "payments still pending"; exit 1; }
          failed=$(echo "$stats" | jq .FAILED)
          echo "settled; failed=$failed (expected only the e2e insufficient-funds case)"
      - name: Verify ledger invariants after load
        run: |
          report=$(curl -fsS http://localhost:8082/api/v1/ledger/verify)
          echo "$report" | jq .
          [ "$(echo "$report" | jq -r .consistent)" = "true" ]
      - name: Publish load-test summary
        if: always()
        run: |
          s=out/summary.json
          [ -f "$s" ] || exit 0
          stats=$(curl -fsS http://localhost:8081/api/v1/payments/stats || echo '{}')
          {
            echo "## Load test results"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Requests | $(jq '.metrics.http_reqs.count' $s) |"
            echo "| Throughput (req/s) | $(jq '.metrics.http_reqs.rate | floor' $s) |"
            echo "| Latency p50 (ms) | $(jq '.metrics.http_req_duration.med | . * 10 | round / 10' $s) |"
            echo "| Latency p95 (ms) | $(jq '.metrics.http_req_duration["p(95)"] | . * 10 | round / 10' $s) |"
            echo "| Latency p99 (ms) | $(jq '.metrics.http_req_duration["p(99)"] | . * 10 | round / 10' $s) |"
            echo "| Failed requests | $(jq '.metrics.http_req_failed.value' $s) |"
            echo "| Final payment states | \`$stats\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # Continuous delivery: publish container images to GitHub Container Registry on main.
  publish-images:
    needs: [e2e-and-load, k8s-manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for svc in payments ledger; do
            image="ghcr.io/$owner/ledgerline-$svc"
            docker build -t "$image:latest" -t "$image:${GITHUB_SHA::7}" "./$svc-service"
            docker push --all-tags "$image"
          done
