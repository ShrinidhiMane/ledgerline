apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  namespace: ledgerline
  labels: { app: payments-service }
spec:
  replicas: 3
  selector:
    matchLabels: { app: payments-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # zero-downtime deploys
  template:
    metadata:
      labels: { app: payments-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: payments-service
          image: ghcr.io/shrinidhimane/ledgerline-payments:latest
          ports: [{ containerPort: 8081 }]
          env:
            - name: DB_URL
              valueFrom: { configMapKeyRef: { name: ledgerline-config, key: PAYMENTS_DB_URL } }
            - name: KAFKA_BOOTSTRAP
              valueFrom: { configMapKeyRef: { name: ledgerline-config, key: KAFKA_BOOTSTRAP } }
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: ledgerline-config, key: REDIS_HOST } }
          envFrom:
            - secretRef: { name: ledgerline-db }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payments-service
  namespace: ledgerline
spec:
  selector: { app: payments-service }
  ports: [{ port: 80, targetPort: 8081 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payments-service
  namespace: ledgerline
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: payments-service }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payments-service
  namespace: ledgerline
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: payments-service }
