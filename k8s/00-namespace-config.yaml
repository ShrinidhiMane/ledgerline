apiVersion: v1
kind: Namespace
metadata:
  name: ledgerline
---
# Postgres, Kafka and Redis are expected to be managed services in a real deployment
# (e.g. Amazon RDS, MSK and ElastiCache). Their endpoints are injected here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledgerline-config
  namespace: ledgerline
data:
  KAFKA_BOOTSTRAP: "kafka.example.internal:9092"
  REDIS_HOST: "redis.example.internal"
  PAYMENTS_DB_URL: "jdbc:postgresql://postgres.example.internal:5432/payments"
  LEDGER_DB_URL: "jdbc:postgresql://postgres.example.internal:5432/ledger"
---
apiVersion: v1
kind: Secret
metadata:
  name: ledgerline-db
  namespace: ledgerline
type: Opaque
stringData:
  DB_USER: ledgerline
  DB_PASSWORD: change-me
